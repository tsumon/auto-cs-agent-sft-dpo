        <text x="12" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#E24A2A">CAT-3</text>
        <text x="12" y="40" font-size="18" font-weight="600" fill="#F4EDE3">故障分流</text>
      </g>
      <g transform="translate(408 0)">
        <rect width="128" height="50" rx="4" fill="#2A221C"/>
        <text x="12" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9A8E82">CAT-4</text>
        <text x="12" y="40" font-size="18" font-weight="600" fill="#F4EDE3">预约受理</text>
      </g>
      <g transform="translate(0 58)">
        <rect width="128" height="50" rx="4" fill="#2A221C"/>
        <text x="12" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9A8E82">CAT-5</text>
        <text x="12" y="40" font-size="18" font-weight="600" fill="#F4EDE3">维修交车</text>
      </g>
      <g transform="translate(136 58)">
        <rect width="128" height="50" rx="4" fill="#2A221C" stroke="#E24A2A" stroke-width="1.2"/>
        <text x="12" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#E24A2A">CAT-6</text>
        <text x="12" y="40" font-size="18" font-weight="600" fill="#F4EDE3">道路救援</text>
      </g>
      <g transform="translate(272 58)">
        <rect width="128" height="50" rx="4" fill="#2A221C"/>
        <text x="12" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9A8E82">CAT-7</text>
        <text x="12" y="40" font-size="18" font-weight="600" fill="#F4EDE3">投诉升级</text>
      </g>
      <g transform="translate(408 58)">
        <rect width="128" height="50" rx="4" fill="#2A221C"/>
        <text x="12" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9A8E82">CAT-8</text>
        <text x="12" y="40" font-size="18" font-weight="600" fill="#F4EDE3">客户运营</text>
      </g>
    </g>

    <!-- work-order ticket -->
    <g transform="translate(700 36)">
      <rect width="444" height="340" rx="6" fill="#FBF6EE"/>
      <!-- perforation -->
      <g fill="#171310">
        <circle cx="0" cy="28" r="5"/>
        <circle cx="0" cy="68" r="5"/>
        <circle cx="0" cy="108" r="5"/>
        <circle cx="0" cy="148" r="5"/>
        <circle cx="0" cy="188" r="5"/>
        <circle cx="0" cy="228" r="5"/>
        <circle cx="0" cy="268" r="5"/>
        <circle cx="0" cy="308" r="5"/>
      </g>
      <line x1="18" y1="16" x2="18" y2="324" stroke="#D8CFC4" stroke-width="1.2" stroke-dasharray="3 7"/>

      <text x="36" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4" fill="#9A8E82">WORK ORDER  ·  WO-CS-014</text>
      <rect x="328" y="18" width="96" height="24" rx="3" fill="#E24A2A"/>
      <text x="376" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#FBF6EE">CAT-6</text>

      <text x="36" y="74" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#2C241C">道路救援 · 地下车库</text>
      <text x="36" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6B6056">VIN  LSVA3616283715801</text>
      <text x="36" y="126" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" fill="#2C241C">普通拖车进不去。先保证安全，再调度。</text>

      <rect x="36" y="146" width="388" height="108" rx="4" fill="#171310"/>
      <text x="52" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9A8E82">&lt;tool_call&gt;</text>
      <text x="52" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#F4EDE3">roadside_assistance_dispatch</text>
      <text x="52" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C9B59A">location: B2 · 限高约 2m</text>
      <text x="52" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9A8E82">&lt;/tool_call&gt;  参数只取用户原话</text>

      <rect x="36" y="270" width="388" height="50" rx="4" fill="#E8F4EE"/>
      <circle cx="58" cy="295" r="8" fill="#2F8F6B"/>
      <path d="M53 295 L57 299 L65 290" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="290" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#2F8F6B">约束闸口  PASS</text>
      <text x="78" y="312" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" fill="#2C241C">请勿继续行驶 · 已发起救援</text>
