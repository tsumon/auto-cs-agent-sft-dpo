<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">汽车售后智能客服 · auto-cs-agent-sft-dpo</title>
  <desc id="desc">把 Qwen2.5-7B 微调成覆盖 8 类售后场景的客服。SFT 教会格式，DPO 几乎不动针，推理期约束层把 Bad Case 砍掉 45%。</desc>

  <defs>
    <clipPath id="hero-clip">
      <rect width="1200" height="420" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="420" fill="#171310"/>

    <!-- oil-bay floor line -->
    <rect x="0" y="412" width="1200" height="8" fill="#2A221C"/>
    <rect x="0" y="0" width="8" height="420" fill="#E24A2A"/>

    <!-- VIN plate -->
    <g transform="translate(56 36)">
      <rect width="268" height="36" rx="4" fill="#2A221C" stroke="#C9B59A" stroke-width="1.4"/>
      <circle cx="12" cy="18" r="3.2" fill="#9A8E82"/>
      <circle cx="256" cy="18" r="3.2" fill="#9A8E82"/>
      <text x="134" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.8" fill="#F4EDE3">AUTO-CS · QWEN2.5-7B</text>
    </g>
    <text x="344" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9A8E82">LoRA r=32 · MI300X · 55 tools</text>

    <text x="56" y="128" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#F4EDE3">汽车售后智能客服</text>

    <text x="56" y="172" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#9A8E82">SFT</text>
    <text x="108" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#5C534C">→</text>
    <text x="138" y="172" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#9A8E82">DPO</text>
    <text x="198" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#5C534C">→</text>
    <text x="228" y="172" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#2F8F6B">约束层</text>
    <text x="314" y="172" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="20" fill="#9A8E82">才是生产方案</text>

    <text x="56" y="214" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="20" fill="#D8CFC4">把通用 7B 调成 8 类售后客服。DPO 在终局上几乎不动针；</text>
    <text x="56" y="242" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="20" fill="#D8CFC4">推理期校验 → 带答案重试 → 兜底，把 Bad Case 砍掉 45%。</text>

    <g transform="translate(56 262)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <rect width="118" height="28" rx="4" fill="#2A221C"/>
      <text x="59" y="19" text-anchor="middle" fill="#F4EDE3">train 640</text>
      <rect x="128" width="110" height="28" rx="4" fill="#2A221C"/>
      <text x="183" y="19" text-anchor="middle" fill="#F4EDE3">val 64</text>
      <rect x="248" width="196" height="28" rx="4" fill="#2A221C" stroke="#E24A2A" stroke-width="1.2"/>
      <text x="346" y="19" text-anchor="middle" fill="#E24A2A">final_test 160 冻结</text>
    </g>

    <!-- 8 service bays, two rows of four -->
    <g transform="translate(56 300)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
