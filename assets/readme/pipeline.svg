<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">16 个脚本按 6 个工位跑完：数据、SFT、DPO、Arena、约束、部署</title>
  <desc id="desc">本机构造并校验数据，GPU 上做 SFT 与 DPO，终局 Arena 盲测后再套约束层，最后用 vLLM 挂 LoRA 服务化。</desc>

  <defs>
    <clipPath id="pipe-clip">
      <rect width="1200" height="360" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pipe-clip)">
    <rect width="1200" height="360" fill="#171310"/>
    <rect x="0" y="0" width="8" height="360" fill="#C9B59A"/>

    <text x="56" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.6" fill="#9A8E82">SERVICE LANE  ·  01 → 16</text>
    <text x="56" y="86" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#F4EDE3">一条售后工位，从种子跑到 vLLM</text>

    <!-- bay floor -->
    <rect x="56" y="168" width="1088" height="6" rx="3" fill="#2A221C"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
      <g transform="translate(56 118)">
        <rect width="160" height="168" rx="6" fill="#2A221C"/>
        <text x="16" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9A8E82">01–03</text>
        <text x="16" y="64" font-size="22" font-weight="700" fill="#F4EDE3">数据</text>
        <text x="16" y="96" font-size="18" fill="#D8CFC4">种子扩写</text>
        <text x="16" y="122" font-size="18" fill="#D8CFC4">覆盖率校验</text>
        <text x="16" y="148" font-size="18" fill="#C9B59A">本机</text>
      </g>

      <g transform="translate(236 118)">
        <rect width="160" height="168" rx="6" fill="#2A221C"/>
        <text x="16" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9A8E82">04–06</text>
        <text x="16" y="64" font-size="22" font-weight="700" fill="#F4EDE3">SFT</text>
        <text x="16" y="96" font-size="18" fill="#D8CFC4">2412 条</text>
        <text x="16" y="122" font-size="18" fill="#D8CFC4">7 维打分</text>
        <text x="16" y="148" font-size="18" fill="#C9B59A">GPU + API</text>
      </g>

      <g transform="translate(416 118)">
        <rect width="160" height="168" rx="6" fill="#2A221C"/>
        <text x="16" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9A8E82">07–10</text>
        <text x="16" y="64" font-size="22" font-weight="700" fill="#F4EDE3">DPO</text>
        <text x="16" y="96" font-size="18" fill="#D8CFC4">450 对 IPO</text>
        <text x="16" y="122" font-size="18" fill="#D8CFC4">beta 0.2</text>
        <text x="16" y="148" font-size="18" fill="#C9B59A">GPU</text>
      </g>

      <g transform="translate(596 118)">
        <rect width="160" height="168" rx="6" fill="#2A221C"/>
        <text x="16" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9A8E82">11–13</text>
        <text x="16" y="64" font-size="22" font-weight="700" fill="#F4EDE3">Arena</text>
        <text x="16" y="96" font-size="18" fill="#D8CFC4">160 条盲测</text>
        <text x="16" y="122" font-size="18" fill="#D8CFC4">双向对调</text>
        <text x="16" y="148" font-size="18" fill="#C9B59A">GPU + API</text>
      </g>

      <g transform="translate(776 118)">
        <rect width="160" height="168" rx="6" fill="#1C332A" stroke="#2F8F6B" stroke-width="1.4"/>
        <text x="16" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#2F8F6B">14–15</text>
        <text x="16" y="64" font-size="22" font-weight="700" fill="#F4EDE3">约束</text>
        <text x="16" y="96" font-size="18" fill="#D8CFC4">校验重试兜底</text>
        <text x="16" y="122" font-size="18" fill="#D8CFC4">64 条盲测</text>
        <text x="16" y="148" font-size="18" fill="#2F8F6B">GPU + API</text>
      </g>

      <g transform="translate(956 118)">
        <rect width="188" height="168" rx="6" fill="#2A221C"/>
        <text x="16" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9A8E82">16</text>
        <text x="16" y="64" font-size="22" font-weight="700" fill="#F4EDE3">部署</text>
        <text x="16" y="96" font-size="18" fill="#D8CFC4">vLLM + LoRA</text>
        <text x="16" y="122" font-size="18" fill="#D8CFC4">生产推理</text>
        <text x="16" y="148" font-size="18" fill="#C9B59A">GPU</text>
      </g>
    </g>
  </g>
</svg>
